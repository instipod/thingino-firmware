<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>thingino · WWAN</title>
  <script src="/a/theme-init.js"></script>
  <link rel="icon" type="image/svg+xml" href="/a/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/a/main.css">
</head>

<body id="page-info-wwan">
<nav data-app-nav></nav>

<main class="pb-4">
  <div class="container" style="min-height:80vh">
    <div data-app-controls></div>

    <section class="card shadow-sm mb-4">
      <div class="card-header d-flex justify-content-between align-items-center gap-3 flex-wrap">
        <div>
          <h5 class="mb-0">WWAN</h5>
          <p class="text-secondary small mb-0">Cellular modems, SIM, network registration and data session.</p>
        </div>
        <div class="d-flex gap-2 align-items-center">
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="wwan-auto" checked>
            <label class="form-check-label small" for="wwan-auto">Auto-refresh</label>
          </div>
          <button type="button" class="btn btn-outline-secondary" id="wwan-refresh">
            <i class="bi bi-arrow-clockwise"></i> Reload
          </button>
        </div>
      </div>
      <div class="card-body">
        <div id="wwan-error" class="alert alert-danger d-none"></div>
        <div id="wwan-spinner" class="text-center text-secondary py-4">
          <div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>
          <span>Querying modems...</span>
        </div>
        <div id="wwan-content" class="d-none">
          <table class="table table-sm mb-3">
            <tbody>
              <tr><th class="text-secondary fw-normal w-25">Modem management</th><td id="wwan-enabled"></td></tr>
              <tr><th class="text-secondary fw-normal">Configured APN</th><td id="wwan-apn"></td></tr>
            </tbody>
          </table>
          <div id="wwan-none" class="alert alert-secondary d-none mb-0">No QMI modem is attached.</div>
          <div id="wwan-modems"></div>
          <div class="text-secondary small mt-3" id="wwan-updated-at"></div>
        </div>
      </div>
    </section>
  </div>
</main>

<footer data-app-footer></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/a/main.js"></script>
<script src="/a/runtime-config.js"></script>
<script src="/a/control-bar.js"></script>
<script src="/a/navigation.js"></script>
<script src="/a/footer.js"></script>
<script src="/a/info-wwan.js"></script>
</body>
</html>
